# ~/.config/kitty/kitty.conf
# Gruvbox Dark / JetBrainsMono Nerd Font

# ── font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures cursor
modify_font cell_height 108%

# ── window ────────────────────────────────────────────────────────────
window_padding_width      14
hide_window_decorations   no
confirm_os_window_close   0
remember_window_size      no
initial_window_width      1100
initial_window_height     680
background_opacity        0.94
dynamic_background_opacity yes

# ── cursor ────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# ── scrollback / bell ─────────────────────────────────────────────────
scrollback_lines   10000
enable_audio_bell  no
visual_bell_duration 0.0

# ── tabs ──────────────────────────────────────────────────────────────
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2
active_tab_font_style   bold
inactive_tab_font_style normal

# ── keys ──────────────────────────────────────────────────────────────
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_window
map ctrl+shift+up    increase_font_size
map ctrl+shift+down  decrease_font_size
map ctrl+shift+0     restore_font_size

# ══ Gruvbox Dark ══════════════════════════════════════════════════════
foreground            #ebdbb2
background            #282828
selection_foreground  #282828
selection_background  #ebdbb2

cursor                #fe8019
cursor_text_color     #282828

url_color             #83a598

active_border_color   #fe8019
inactive_border_color #504945
bell_border_color     #fb4934

active_tab_foreground   #282828
active_tab_background   #fe8019
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
tab_bar_background      #1d2021

